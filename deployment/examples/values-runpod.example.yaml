remoteCompute:
  enabled: true
  endpointId: REPLACE_WITH_RUNPOD_ENDPOINT_ID
  # RunPod does not publish a stable hostname selector usable by standard
  # NetworkPolicy. This explicit rule permits only TCP/443 from the mastering worker.
  egressCIDRs:
    - 0.0.0.0/0

minio:
  enabled: true
  bucket: openmaster
  region: us-east-1
  publicIngress:
    enabled: true
    className: traefik
    host: s3.REPLACE_WITH_DOMAIN
    publicEndpoint: https://s3.REPLACE_WITH_DOMAIN
    tls:
      enabled: true
      secretName: openmaster-minio-tls

workers:
  mastering:
    replicaCount: 1
    concurrency: 1
    resources:
      requests: {cpu: 50m, memory: 128Mi}
      limits: {cpu: 250m, memory: 256Mi}
