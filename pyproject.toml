[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "openmaster"
version = "2.8.0"
description = "Open-source audio mastering platform"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["alembic>=1.13", "celery>=5.4", "fastapi>=0.115", "minio>=7.2,<8", "numpy>=1.26", "psycopg[binary]>=3.2", "python-multipart>=0.0.18", "redis>=5.0", "scipy>=1.11", "sqlalchemy>=2.0", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "mypy>=1.11"]
runpod = ["runpod>=1.8,<2"]

[tool.setuptools.packages.find]
include = ["packages*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["packages"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["packages.task_runtime.tasks"]
disallow_untyped_decorators = false
