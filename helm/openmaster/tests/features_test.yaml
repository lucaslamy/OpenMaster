suite: optional production controls
tests:
  - it: disables network policies
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: enables network policies
    template: templates/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
        documentIndex: 0
  - it: disables HPA
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables API and worker HPAs
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 4
  - it: disables PDB
    template: templates/pdb.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables PDB
    template: templates/pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 5
  - it: disables ingress
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables ingress
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: openmaster.example.com
    asserts:
      - isKind:
          of: Ingress
  - it: runs migration after first-install resources are ready
    template: templates/migration-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
  - it: exposes non-secret RunPod endpoint configuration
    template: templates/configmap.yaml
    set:
      remoteCompute.enabled: true
      remoteCompute.endpointId: endpoint-123
    asserts:
      - equal:
          path: data.OPENMASTER_REMOTE_COMPUTE_ENABLED
          value: "true"
      - equal:
          path: data.RUNPOD_ENDPOINT_ID
          value: endpoint-123
  - it: limits RunPod egress to HTTPS from mastering
    template: templates/networkpolicy.yaml
    set:
      remoteCompute.enabled: true
      remoteCompute.endpointId: endpoint-123
      remoteCompute.egressCIDRs[0]: 0.0.0.0/0
    asserts:
      - equal:
          path: spec.egress[3].ports[0].port
          value: 443
        documentIndex: 6
