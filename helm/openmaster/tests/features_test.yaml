suite: optional production controls
tests:
  - it: disables network policies
    template: templates/networkpolicy.yaml
    set:
      networkPolicy.enabled: false
    asserts:
      - hasDocuments:
          count: 0
  - it: enables network policies
    template: templates/networkpolicy.yaml
    asserts:
      - isKind:
          of: NetworkPolicy
        documentIndex: 0
  - it: disables HPA
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables API and worker HPAs
    template: templates/hpa.yaml
    set:
      autoscaling.enabled: true
    asserts:
      - hasDocuments:
          count: 4
  - it: disables PDB
    template: templates/pdb.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables PDB
    template: templates/pdb.yaml
    set:
      podDisruptionBudget.enabled: true
    asserts:
      - hasDocuments:
          count: 5
  - it: disables ingress
    template: templates/ingress.yaml
    asserts:
      - hasDocuments:
          count: 0
  - it: enables ingress
    template: templates/ingress.yaml
    set:
      ingress.enabled: true
      ingress.host: openmaster.example.com
      ingress.annotations:
        nginx.ingress.kubernetes.io/proxy-body-size: "2048m"
        nginx.ingress.kubernetes.io/proxy-request-buffering: "off"
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-body-size"]
          value: "2048m"
      - equal:
          path: metadata.annotations["nginx.ingress.kubernetes.io/proxy-request-buffering"]
          value: "off"
  - it: runs migration after first-install resources are ready
    template: templates/migration-job.yaml
    asserts:
      - equal:
          path: metadata.annotations["helm.sh/hook"]
          value: post-install,pre-upgrade
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
  - it: runs workers with a verifiable numeric non-root identity
    template: templates/workers.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 10001
        documentIndex: 0
      - equal:
          path: spec.template.spec.securityContext.runAsGroup
          value: 10001
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp
        documentIndex: 0
      - equal:
          path: spec.template.spec.initContainers[0].command[2]
          value: packages.task_runtime.wait_for_broker
        documentIndex: 0
  - it: gives unprivileged nginx writable temporary storage
    template: templates/web.yaml
    asserts:
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 101
        documentIndex: 0
      - equal:
          path: spec.template.spec.containers[0].volumeMounts[0].mountPath
          value: /tmp
        documentIndex: 0
      - equal:
          path: spec.template.spec.volumes[0].emptyDir.sizeLimit
          value: 2Gi
        documentIndex: 0
  - it: keeps API health probes on the container
    template: templates/api-deployment.yaml
    asserts:
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.path
          value: /health/ready
      - equal:
          path: spec.template.spec.containers[0].readinessProbe.httpGet.path
          value: /health/ready
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.path
          value: /health/live
      - notExists:
          path: spec.template.spec.volumes[0].startupProbe
      - notExists:
          path: spec.template.spec.volumes[0].readinessProbe
      - notExists:
          path: spec.template.spec.volumes[0].livenessProbe
  - it: exposes non-secret RunPod endpoint configuration
    template: templates/configmap.yaml
    set:
      remoteCompute.enabled: true
      remoteCompute.endpointId: endpoint-123
    asserts:
      - equal:
          path: data.OPENMASTER_REMOTE_COMPUTE_ENABLED
          value: "true"
      - equal:
          path: data.RUNPOD_ENDPOINT_ID
          value: endpoint-123
  - it: exposes internal MinIO configuration without remote compute
    template: templates/configmap.yaml
    asserts:
      - equal:
          path: data.MINIO_INTERNAL_ENDPOINT
          value: http://RELEASE-NAME-openmaster-minio:9000
      - equal:
          path: data.MINIO_BUCKET
          value: openmaster
  - it: limits RunPod egress to HTTPS from mastering
    template: templates/networkpolicy.yaml
    set:
      remoteCompute.enabled: true
      remoteCompute.endpointId: endpoint-123
      remoteCompute.egressCIDRs[0]: 0.0.0.0/0
    asserts:
      - equal:
          path: spec.egress[3].ports[0].port
          value: 443
        documentIndex: 6
  - it: exposes only the MinIO S3 service through its dedicated ingress
    template: templates/minio-ingress.yaml
    set:
      minio.publicIngress.enabled: true
      minio.publicIngress.host: s3.openmaster.example
      minio.publicIngress.publicEndpoint: https://s3.openmaster.example
      minio.publicIngress.tls.secretName: openmaster-minio-tls
    asserts:
      - isKind:
          of: Ingress
      - equal:
          path: spec.rules[0].host
          value: s3.openmaster.example
      - equal:
          path: spec.rules[0].http.paths[0].backend.service.port.name
          value: api
  - it: renders MinIO endpoints for remote object signing
    template: templates/configmap.yaml
    set:
      remoteCompute.enabled: true
      remoteCompute.endpointId: endpoint-123
      minio.publicIngress.enabled: true
      minio.publicIngress.host: s3.openmaster.example
      minio.publicIngress.publicEndpoint: https://s3.openmaster.example
      minio.publicIngress.tls.secretName: openmaster-minio-tls
    asserts:
      - equal:
          path: data.MINIO_PUBLIC_ENDPOINT
          value: https://s3.openmaster.example
      - equal:
          path: data.MINIO_INTERNAL_ENDPOINT
          value: http://RELEASE-NAME-openmaster-minio:9000
  - it: renders endpoints for a shared external MinIO
    template: templates/configmap.yaml
    set:
      remoteCompute.enabled: true
      remoteCompute.endpointId: endpoint-123
      minio.enabled: false
      minio.externalHost: minio.clipforge.svc.cluster.local
      minio.externalPublicEndpoint: https://s3.example.com
      minio.bucket: openmaster
    asserts:
      - equal:
          path: data.MINIO_INTERNAL_ENDPOINT
          value: http://RELEASE-NAME-openmaster-minio:9000
      - equal:
          path: data.MINIO_PUBLIC_ENDPOINT
          value: https://s3.example.com
      - equal:
          path: data.MINIO_BUCKET
          value: openmaster
