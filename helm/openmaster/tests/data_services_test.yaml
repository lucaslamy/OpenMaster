suite: data service modes
templates:
  - templates/data-services.yaml
tests:
  - it: renders all internal workloads
    asserts:
      - hasDocuments:
          count: 6
      - isKind:
          of: StatefulSet
        documentIndex: 1
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openmaster-postgres
        documentIndex: 1
      - equal:
          path: spec.template.spec.initContainers[0].securityContext.runAsUser
          value: 0
        documentIndex: 1
      - equal:
          path: spec.template.spec.initContainers[0].command[2]
          value: chown -R 70:70 /var/lib/postgresql/data /var/run/postgresql
        documentIndex: 1
      - isKind:
          of: StatefulSet
        documentIndex: 3
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openmaster-redis
        documentIndex: 3
      - equal:
          path: spec.template.spec.securityContext.runAsUser
          value: 999
        documentIndex: 3
      - isKind:
          of: StatefulSet
        documentIndex: 5
      - equal:
          path: metadata.name
          value: RELEASE-NAME-openmaster-minio
        documentIndex: 5
  - it: renders external services without workloads
    set:
      postgresql.enabled: false
      postgresql.externalHost: postgres.example.internal
      redis.enabled: false
      redis.externalHost: redis.example.internal
      minio.enabled: false
      minio.externalHost: minio.example.internal
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.type
          value: ExternalName
        documentIndex: 0
      - equal:
          path: spec.externalName
          value: postgres.example.internal
        documentIndex: 0
