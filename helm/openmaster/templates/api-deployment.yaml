apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmaster.fullname" . }}-api
  labels:
    {{- include "openmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        {{- include "openmaster.labels" . | nindent 8 }}
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "openmaster.fullname" . }}
      automountServiceAccountToken: false
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: {{ default (include "openmaster.image" .) .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: {{ include "openmaster.fullname" . }}-config}
            {{- if .Values.externalSecrets.enabled }}
            - secretRef: {name: {{ include "openmaster.secretName" . }}}
            {{- end }}
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          startupProbe: {httpGet: {path: /health/ready, port: http}, failureThreshold: 30, periodSeconds: 5}
          readinessProbe: {httpGet: {path: /health/ready, port: http}, periodSeconds: 10}
          livenessProbe: {httpGet: {path: /health/live, port: http}, periodSeconds: 20}
