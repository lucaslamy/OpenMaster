{{- if .Values.migration.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openmaster.fullname" . }}-migrate
  labels: {{- include "openmaster.componentLabels" (dict "root" . "component" "migration") | nindent 4 }}
  annotations:
    # On a first install, internal PostgreSQL does not exist until the regular chart
    # resources are ready. Helm --wait delays post-install hooks until that point.
    # Existing releases already have their database available during pre-upgrade.
    helm.sh/hook: post-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  ttlSecondsAfterFinished: {{ .Values.migration.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels: {{- include "openmaster.componentLabels" (dict "root" . "component" "migration") | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openmaster.fullname" . }}
      automountServiceAccountToken: false
      restartPolicy: Never
      securityContext: {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ default (include "openmaster.image" .) .Values.api.image | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [alembic, upgrade, head]
          envFrom:
            - configMapRef: {name: {{ include "openmaster.fullname" . }}-config}
            - secretRef: {name: {{ include "openmaster.secretName" . }}}
          resources: {{- toYaml .Values.migration.resources | nindent 12 }}
          securityContext: {{- toYaml .Values.containerSecurityContext | nindent 12 }}
{{- end }}
