apiVersion: apps/v1
kind: Deployment
metadata: {name: {{ include "openmaster.fullname" . }}-web}
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector: {matchLabels: {app: {{ include "openmaster.fullname" . }}-web}}
  template:
    metadata: {labels: {app: {{ include "openmaster.fullname" . }}-web}}
    spec:
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: web
        image: {{ default (include "openmaster.image" .) .Values.web.image | quote }}
        ports: [{name: http, containerPort: 8080}]
        resources: {{- toYaml .Values.web.resources | nindent 10 }}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
        readinessProbe: {httpGet: {path: /, port: http}}
---
apiVersion: v1
kind: Service
metadata: {name: {{ include "openmaster.fullname" . }}-web}
spec: {selector: {app: {{ include "openmaster.fullname" . }}-web}, ports: [{port: 80, targetPort: http}]}
