{{- range $name, $worker := .Values.workers }}
{{- if ne $name "image" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmaster.fullname" $ }}-{{ $name }}-worker
  labels:
    {{- include "openmaster.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-worker
spec:
  {{- if not $.Values.autoscaling.enabled }}
  replicas: {{ $worker.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}-worker}
  template:
    metadata:
      labels: {{- include "openmaster.componentLabels" (dict "root" $ "component" (printf "%s-worker" $name)) | nindent 8 }}
    spec:
      serviceAccountName: {{ include "openmaster.fullname" $ }}
      automountServiceAccountToken: false
      securityContext: {{- toYaml $.Values.applicationPodSecurityContext | nindent 8 }}
      initContainers:
        - name: wait-for-broker
          image: {{ default (include "openmaster.image" $) $.Values.workers.image | quote }}
          command: ["python", "-m", "packages.task_runtime.wait_for_broker"]
          envFrom:
            - configMapRef: {name: {{ include "openmaster.fullname" $ }}-config}
            - secretRef: {name: {{ include "openmaster.secretName" $ }}}
          resources:
            requests: {cpu: 5m, memory: 16Mi}
            limits: {cpu: 50m, memory: 64Mi}
          securityContext: {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
      containers:
        - name: {{ $name }}
          image: {{ default (include "openmaster.image" $) $.Values.workers.image | quote }}
          command: ["celery", "-A", "packages.task_runtime.celery_app", "worker", "-Q", {{ $name | quote }}, "--concurrency", {{ $worker.concurrency | quote }}]
          envFrom:
            - configMapRef: {name: {{ include "openmaster.fullname" $ }}-config}
            - secretRef: {name: {{ include "openmaster.secretName" $ }}}
          resources: {{- toYaml $worker.resources | nindent 12 }}
          securityContext: {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: {{ $.Values.temporaryStorage.sizeLimit }}
---
{{- end }}
{{- end }}
