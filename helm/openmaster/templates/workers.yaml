{{- range $name, $worker := .Values.workers }}
{{- if ne $name "image" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openmaster.fullname" $ }}-{{ $name }}-worker
  labels:
    {{- include "openmaster.labels" $ | nindent 4 }}
    app.kubernetes.io/component: {{ $name }}-worker
spec:
  replicas: {{ $worker.replicaCount }}
  selector:
    matchLabels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}-worker}
  template:
    metadata:
      labels: {app.kubernetes.io/instance: {{ $.Release.Name }}, app.kubernetes.io/component: {{ $name }}-worker}
    spec:
      serviceAccountName: {{ include "openmaster.fullname" $ }}
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
        - name: {{ $name }}
          image: {{ default (include "openmaster.image" $) $.Values.workers.image | quote }}
          command: ["celery", "-A", "packages.task_runtime.celery_app", "worker", "-Q", {{ $name | quote }}, "--concurrency", {{ $worker.concurrency | quote }}]
          envFrom:
            - configMapRef: {name: {{ include "openmaster.fullname" $ }}-config}
            {{- if $.Values.externalSecrets.enabled }}
            - secretRef: {name: {{ include "openmaster.secretName" $ }}}
            {{- end }}
          resources: {{- toYaml $worker.resources | nindent 12 }}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
{{- end }}
{{- end }}
