apiVersion: v1
kind: Service
metadata:
  name: {{ include "openmaster.fullname" . }}-api
  labels:
    {{- include "openmaster.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/component: api
  ports: [{name: http, port: {{ .Values.api.service.port }}, targetPort: http}]
