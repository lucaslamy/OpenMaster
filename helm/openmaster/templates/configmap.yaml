apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmaster.fullname" . }}-config
  labels:
    {{- include "openmaster.labels" . | nindent 4 }}
data:
  OPENMASTER_ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.config.maxUploadBytes | quote }}
  MASTERING_ACCESS_TOKEN_TTL_SECONDS: {{ .Values.config.masteringAccessTokenTtlSeconds | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  PROCESSING_RETRIES: {{ .Values.config.processingRetries | quote }}
  OPENMASTER_REMOTE_COMPUTE_ENABLED: {{ .Values.remoteCompute.enabled | quote }}
  LAMAI_ENABLED: {{ .Values.lamai.enabled | quote }}
  {{- if .Values.lamai.enabled }}
  LAMAI_BASE_URL: {{ required "lamai.baseUrl is required when LamAI is enabled" .Values.lamai.baseUrl | quote }}
  LAMAI_TIMEOUT_SECONDS: {{ .Values.lamai.timeoutSeconds | quote }}
  {{- end }}
  {{- if .Values.minio.enabled }}
  MINIO_INTERNAL_ENDPOINT: {{ printf "http://%s-minio:9000" (include "openmaster.fullname" .) | quote }}
  {{- if .Values.minio.publicIngress.enabled }}
  MINIO_PUBLIC_ENDPOINT: {{ required "minio.publicIngress.publicEndpoint is required for master downloads" .Values.minio.publicIngress.publicEndpoint | quote }}
  {{- end }}
  {{- else }}
  MINIO_INTERNAL_ENDPOINT: {{ printf "http://%s-minio:%v" (include "openmaster.fullname" .) .Values.minio.externalPort | quote }}
  MINIO_PUBLIC_ENDPOINT: {{ required "minio.externalPublicEndpoint is required with external MinIO" .Values.minio.externalPublicEndpoint | quote }}
  {{- end }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  MINIO_REGION: {{ .Values.minio.region | quote }}
  {{- if .Values.remoteCompute.enabled }}
  RUNPOD_ENDPOINT_ID: {{ required "remoteCompute.endpointId is required when remote compute is enabled" .Values.remoteCompute.endpointId | quote }}
  {{- end }}
