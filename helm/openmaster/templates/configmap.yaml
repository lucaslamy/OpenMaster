apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openmaster.fullname" . }}-config
  labels:
    {{- include "openmaster.labels" . | nindent 4 }}
data:
  OPENMASTER_ENVIRONMENT: {{ .Values.global.environment | quote }}
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  MAX_UPLOAD_BYTES: {{ .Values.config.maxUploadBytes | quote }}
  CORS_ORIGINS: {{ .Values.config.corsOrigins | quote }}
  PROCESSING_RETRIES: {{ .Values.config.processingRetries | quote }}
  OPENMASTER_REMOTE_COMPUTE_ENABLED: {{ .Values.remoteCompute.enabled | quote }}
  {{- if .Values.remoteCompute.enabled }}
  RUNPOD_ENDPOINT_ID: {{ required "remoteCompute.endpointId is required when remote compute is enabled" .Values.remoteCompute.endpointId | quote }}
  {{- end }}
