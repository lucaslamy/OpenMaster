global:
  environment: development
  imagePullSecrets: []

# The chart never creates this Secret. In production it is materialized by the
# ClusterExternalSecret/ExternalSecret pair described in the deployment guide.
externalSecrets:
  enabled: false
  existingSecretName: openmaster-secrets
  requiredKeys:
    - DATABASE_URL
    - CELERY_BROKER_URL
    - CELERY_RESULT_BACKEND
    - POSTGRES_DB
    - POSTGRES_USER
    - POSTGRES_PASSWORD
    - MINIO_ROOT_USER
    - MINIO_ROOT_PASSWORD
    - MASTERING_ACCESS_PASSWORD
    # Required only when lamai.enabled=true; preflight enforces it conditionally.
    - LAMAI_API_KEY

image:
  registry: registry.example.com
  repository: openmaster
  tag: "3.3.0"
  pullPolicy: IfNotPresent

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

applicationPodSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: [ALL]

api:
  image: ""
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}
  probes:
    startup: {failureThreshold: 30, periodSeconds: 5}
    readiness: {periodSeconds: 10}
    liveness: {periodSeconds: 20}

web:
  image: ""
  replicaCount: 1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 101
    runAsGroup: 101
    fsGroup: 101
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}
  probes:
    readiness: {periodSeconds: 10}
    liveness: {periodSeconds: 20}

temporaryStorage:
  sizeLimit: 2Gi

workers:
  image: ""
  analysis:
    replicaCount: 1
    concurrency: 2
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}
  mastering:
    replicaCount: 1
    concurrency: 1
    resources:
      requests: {cpu: 500m, memory: 1Gi}
      limits: {cpu: "4", memory: 4Gi}
  export:
    replicaCount: 1
    concurrency: 1
    resources:
      requests: {cpu: 250m, memory: 512Mi}
      limits: {cpu: "2", memory: 2Gi}

config:
  logLevel: INFO
  maxUploadBytes: "2147483648"
  # The proof is verified after multipart parsing, so it must cover slow uploads.
  masteringAccessTokenTtlSeconds: "7200"
  corsOrigins: ""
  processingRetries: "3"

remoteCompute:
  enabled: false
  provider: runpod
  endpointId: ""
  # Standard NetworkPolicy cannot select an FQDN. Add only reviewed destination
  # CIDRs. A deliberate 0.0.0.0/0 permits HTTPS only, not unrestricted ports.
  egressCIDRs: []

lamai:
  enabled: false
  baseUrl: ""
  timeoutSeconds: 90
  servicePort: 8080
  networkPolicy:
    namespaceSelector: {}
    podSelector: {}
  egressCIDRs: []

ingress:
  enabled: false
  className: traefik
  controllerNamespace: kube-system
  controllerPodLabels:
    app.kubernetes.io/name: traefik
  host: ""
  annotations: {}
  tls:
    enabled: false
    secretName: ""

postgresql:
  enabled: true
  image: postgres:16-alpine
  volumePermissionsImage: busybox:1.36.1
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 70
    runAsGroup: 70
    fsGroup: 70
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  externalHost: ""
  externalPort: 5432
  persistence:
    size: 20Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

redis:
  enabled: true
  image: redis:7-alpine
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 999
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  externalHost: ""
  externalPort: 6379
  persistence:
    enabled: false
    size: 5Gi
    storageClassName: ""
  resources:
    requests: {cpu: 50m, memory: 64Mi}
    limits: {cpu: 500m, memory: 512Mi}

minio:
  enabled: true
  image: minio/minio:RELEASE.2024-10-13T13-34-11Z
  podSecurityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile: {type: RuntimeDefault}
  externalHost: ""
  externalPort: 9000
  # Public HTTPS origin used in presigned URLs when MinIO is managed outside
  # this chart, for example https://s3.example.com.
  externalPublicEndpoint: ""
  externalNetworkPolicy:
    namespaceSelector: {}
    podSelector: {}
  bucket: openmaster
  region: us-east-1
  publicIngress:
    enabled: false
    className: traefik
    host: ""
    publicEndpoint: ""
    annotations: {}
    tls:
      enabled: true
      secretName: ""
  persistence:
    size: 50Gi
    storageClassName: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

networkPolicy:
  enabled: true
  dns:
    namespaceSelector:
      kubernetes.io/metadata.name: kube-system
    podSelector:
      k8s-app: kube-dns
  # External dependencies cannot be selected by pod labels. Supply explicit CIDRs
  # for each disabled internal service; broad CIDRs should be reviewed carefully.
  externalEgress:
    postgresql: []
    redis: []
    minio: []

autoscaling:
  enabled: false
  api:
    minReplicas: 2
    maxReplicas: 6
    targetCPUUtilizationPercentage: 70
  workers:
    analysis: {minReplicas: 1, maxReplicas: 6, targetCPUUtilizationPercentage: 70}
    mastering: {minReplicas: 1, maxReplicas: 4, targetCPUUtilizationPercentage: 70}
    export: {minReplicas: 1, maxReplicas: 4, targetCPUUtilizationPercentage: 70}

podDisruptionBudget:
  enabled: false
  minAvailable: 1
  components: [api, web, analysis-worker, mastering-worker, export-worker]

migration:
  enabled: true
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  resources:
    requests: {cpu: 100m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
