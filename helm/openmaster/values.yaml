global:
  environment: development
  imagePullSecrets: []

externalSecrets:
  enabled: false
  existingSecretName: ""

image:
  registry: registry.example.com
  repository: openmaster
  tag: "2.0.0"
  pullPolicy: IfNotPresent

api:
  image: ""
  replicaCount: 1
  service:
    port: 8000
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: "1", memory: 1Gi}

web:
  image: ""
  replicaCount: 1
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 250m, memory: 256Mi}

workers:
  image: ""
  analysis: {replicaCount: 1, concurrency: 2, resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}}
  mastering: {replicaCount: 1, concurrency: 1, resources: {requests: {cpu: 500m, memory: 1Gi}, limits: {cpu: "4", memory: 4Gi}}}
  export: {replicaCount: 1, concurrency: 1, resources: {requests: {cpu: 250m, memory: 512Mi}, limits: {cpu: "2", memory: 2Gi}}}

config:
  logLevel: INFO
  maxUploadBytes: "2147483648"
  corsOrigins: ""
  processingRetries: "3"

ingress:
  enabled: false
  className: traefik
  host: ""
  tls:
    enabled: false
    secretName: ""

postgresql: {enabled: true, image: postgres:16-alpine, storage: 20Gi, storageClassName: "", externalHost: "", externalPort: 5432}
redis: {enabled: true, image: redis:7-alpine, persistence: {enabled: false, size: 5Gi, storageClassName: ""}, externalHost: "", externalPort: 6379}
minio: {enabled: true, image: minio/minio:RELEASE.2024-10-13T13-34-11Z, storage: 50Gi, storageClassName: "", externalHost: "", externalPort: 9000}
